name: Update IPTV playlist
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iptv_filter.py'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: playlist-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate playlist
        run: python iptv_filter.py
      - name: Publish playlist and update timestamp
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add my-iptv.m3u status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh IPTV playlist"
            git push
          fi
